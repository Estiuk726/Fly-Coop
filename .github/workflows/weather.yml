name: Update LHBP weather

on:
  schedule:
    # every 15 minutes, off the busy :00/:30 marks so GitHub is less likely to delay or skip runs
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch METAR and TAF
        run: |
          set -e
          METAR=$(curl -fsS "https://aviationweather.gov/api/data/metar?ids=LHBP&format=raw" | tr -s ' \n' ' ' | sed 's/ *$//')
          TAF=$(curl -fsS "https://aviationweather.gov/api/data/taf?ids=LHBP&format=raw" | tr -s ' \n' ' ' | sed 's/ *$//')
          if [ -z "$METAR" ] || [ -z "$TAF" ]; then echo "Empty response, keeping old file"; exit 0; fi
          NOTAMS=$(python3 scripts/notams.py LHBS || true)
          if [ -z "$NOTAMS" ] && [ -f weather.json ]; then NOTAMS=$(jq -c '.notams // []' weather.json); fi
          [ -z "$NOTAMS" ] && NOTAMS='[]'
          jq -n --arg m "$METAR" --arg t "$TAF" --argjson n "$NOTAMS" \
            '{station:"LHBP", metar:$m, taf:$t, notams:$n}' > weather.json
          cat weather.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- weather.json 2>/dev/null && git ls-files --error-unmatch weather.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "Update LHBP weather"
          git pull --rebase -q origin main
          git push
